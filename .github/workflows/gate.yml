# ════════════════════════════════════════════════════════════════════════════
# THE RELEASE GATE — five projects plus the accounts-OFF sliver, on Linux.
#
# ⚠️ THIS EXISTS BECAUSE SMART APP CONTROL BLOCKED WEBKIT TWICE ON THE ONLY
# MACHINE THAT COULD RUN THE MATRIX.
#
# v0.18.0 and v0.23.0 both shipped on transferred evidence: `browserType.launch`
# failing before a single test, 302 times in the second case, with WebKit's own
# DLLs present on disk and refused at load. Re-downloading fixed it once and
# does not any more, and disabling Smart App Control is documented by Microsoft
# as one-way. A Linux runner has no such policy, so the lane that caught the
# "Créer" click-synthesis bug — invisible in Blink and Gecko — becomes reliable
# again.
#
# ⚠️ CI IS THE GATE OF RECORD. `npm run test:release` still works locally and is
# still the right thing for a developer who wants the whole matrix in one go;
# it is no longer what a promotion rests on.
#
# ⚠️ THE PROJECTS RUN IN PARALLEL HERE, AND THAT IS NOT A DISAGREEMENT WITH
# `test-release.mjs`. That script runs them ONE AT A TIME under a worker cap
# because the local machine runs out of RAM — measured, and the reason four
# gates went red. Every job below is its own runner with its own memory, so the
# constraint the serialisation exists for does not exist here.
# ════════════════════════════════════════════════════════════════════════════
name: gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A second push supersedes the first — a gate for a tree nobody is promoting
# any more is just queue time.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22.12 is the floor in package.json `engines`.
  NODE_VERSION: '22'

# ⚠️ KNOWN INTERACTION, RECORDED BEFORE IT SURPRISES SOMEBODY: the build here
# has no Supabase build variables, so `fetch-agenda.mjs` bakes
# `src/data/agenda.fallback.json` — and v0.23.0 gave that a guard which FAILS
# the build once every session in the fallback has passed. The committed
# fallback's newest session is 2026-09-12, so this gate starts WARNING around
# 2026-08-29 and starts FAILING after 2026-09-12, for a reason that has nothing
# to do with the change under test.
#
# That is the guard working, not a bug — but in CI it blocks the gate. The fix
# is to refresh the fallback from the live table (already a backlog item), or
# to give this workflow read-only agenda credentials so it bakes the real one.
# Do not "fix" it by removing the guard: a stale agenda is worse than an empty
# one, and `smoke:prod` is structurally blind to it.

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ⚠️ PREFLIGHT RUNS FIRST AND EVERYTHING DEPENDS ON IT.
  #
  # Two things that are cheap here and expensive later: a lane naming a spec
  # that does not exist makes `testMatch` match NOTHING, so the project runs
  # zero tests and goes green having proved less than it claims; and a missing
  # secret produces no `.env.test`, which makes every auth spec SKIP while the
  # gate still passes. Both are "quietly stopped proving something", which is
  # the failure this whole gate design is shaped around.
  # ──────────────────────────────────────────────────────────────────────────
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # ⚠️ WRITTEN, NOT EXPORTED. `tests/e2e/env.ts` reads ONLY this file and
      # never `process.env` — deliberately, because a loader that fell back to
      # the environment is what would let production credentials into a suite
      # that purges by pattern. CLAUDE.md forbids widening it, so CI produces
      # the file the loader already expects and changes no code.
      #
      # ⚠️ The values are interpolated through `env:` rather than written into
      # the script body, so they are never part of a command line.
      - name: Write .env.test from secrets
        env:
          TEST_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_PUBLIC_SUPABASE_URL }}
          TEST_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE }}
          TEST_SUPABASE_PASSWORD: ${{ secrets.TEST_SUPABASE_PASSWORD }}
          SUPABASE_PRODUCTION_REF: ${{ secrets.SUPABASE_PRODUCTION_REF }}
        run: |
          umask 077
          {
            printf 'TEST_PUBLIC_SUPABASE_URL=%s\n' "$TEST_PUBLIC_SUPABASE_URL"
            printf 'TEST_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$TEST_PUBLIC_SUPABASE_ANON_KEY"
            printf 'TEST_SUPABASE_SERVICE_ROLE=%s\n' "$TEST_SUPABASE_SERVICE_ROLE"
            printf 'TEST_SUPABASE_PASSWORD=%s\n' "$TEST_SUPABASE_PASSWORD"
            printf 'SUPABASE_PRODUCTION_REF=%s\n' "$SUPABASE_PRODUCTION_REF"
          } > .env.test

      # ⚠️ THE INTERLOCK, CALLED RATHER THAN REIMPLEMENTED. Fails the whole
      # gate when the refs match, when a secret is missing, or when the file
      # would leave auth specs skipping silently. See scripts/ci-preflight.mjs.
      - name: Preflight — credentials present, and NOT production
        run: node scripts/ci-preflight.mjs

      # Advisory by design and must never gate — but `missingLaneSpecs()`
      # inside it IS a fact about the filesystem, and test-release checks it
      # before a browser starts. Same reasoning here.
      - name: Lane membership names specs that exist
        run: node scripts/check-lanes.mjs

  # ──────────────────────────────────────────────────────────────────────────
  # THE MATRIX — accounts ON, because that is what production serves.
  # ──────────────────────────────────────────────────────────────────────────
  matrix:
    name: ${{ matrix.project }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # ⚠️ NOT fail-fast. One project dying must not cancel the other four:
      # the whole point of the lanes is that they answer different questions,
      # and a cancelled run cannot tell you whether webkit was also broken.
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: pixel-5
            browser: chromium
          - project: iphone-13
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Only the browser this project needs. `--with-deps` is what installs the
      # system libraries WebKit needs on Linux — the step that has no analogue
      # on the Windows machine, and the reason this works here.
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Write .env.test from secrets
        env:
          TEST_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_PUBLIC_SUPABASE_URL }}
          TEST_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE }}
          TEST_SUPABASE_PASSWORD: ${{ secrets.TEST_SUPABASE_PASSWORD }}
          SUPABASE_PRODUCTION_REF: ${{ secrets.SUPABASE_PRODUCTION_REF }}
        run: |
          umask 077
          {
            printf 'TEST_PUBLIC_SUPABASE_URL=%s\n' "$TEST_PUBLIC_SUPABASE_URL"
            printf 'TEST_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$TEST_PUBLIC_SUPABASE_ANON_KEY"
            printf 'TEST_SUPABASE_SERVICE_ROLE=%s\n' "$TEST_SUPABASE_SERVICE_ROLE"
            printf 'TEST_SUPABASE_PASSWORD=%s\n' "$TEST_SUPABASE_PASSWORD"
            printf 'SUPABASE_PRODUCTION_REF=%s\n' "$SUPABASE_PRODUCTION_REF"
          } > .env.test

      # ⚠️ EVERY JOB RE-ASSERTS IT. The preflight job proved the secrets were
      # right on ITS runner; this is a different machine with a different
      # checkout, and "it was fine over there" is not a property of this one.
      - name: Preflight — credentials present, and NOT production
        run: node scripts/ci-preflight.mjs

      # Playwright's `webServer` builds and serves; PUBLIC_AUTH_ENABLED reaches
      # the build through it.
      - name: ${{ matrix.project }} — accounts ON
        env:
          CI: 'true'
          PUBLIC_AUTH_ENABLED: 'true'
        run: npx playwright test --project=${{ matrix.project }}

      # ⚠️ ON FAILURE ONLY, AND THIS IS THE WHOLE REASON THE ARTEFACT WORK
      # EXISTS. Three consecutive gates ended in "probably environmental" with
      # the evidence deleted before anyone read it. `error-context.md` carries
      # the page state at the moment of failure, and a trace is attached on the
      # first retry — read those BEFORE calling a row environmental.
      - name: Keep the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artefacts-${{ matrix.project }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # ⚠️ THE ACCOUNTS-OFF SLIVER IS NOT A SECOND MATRIX.
  #
  # Exactly two specs can only be proved by an accounts-OFF BUILD, because they
  # are claims about the artefact that shape produces: `auth-disabled` (no route
  # emitted, no Supabase ref anywhere in the bundle) and `admin`'s "the admin
  # surfaces are NOT BUILT" describe. The second build is irreducible — you
  # cannot inspect an artefact you did not produce — and it is the whole cost:
  # chromium only, because neither is engine-sensitive.
  #
  # It is a separate JOB rather than a step, so it gets a clean runner and can
  # never attach to the accounts-ON preview server. Locally that hazard is real
  # and `test-release.mjs` sweeps between the two for exactly this reason.
  # ──────────────────────────────────────────────────────────────────────────
  sliver:
    name: accounts-OFF sliver
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ⚠️ NO .env.test HERE, AND THAT IS CORRECT RATHER THAN AN OMISSION. This
      # shape has no account routes at all, so there is nothing to sign in to;
      # `env.ts` treats an absent file as safe (no reachable project of any
      # kind) and the auth specs are not in this selection anyway.

      # ⚠️ PUBLIC_AUTH_ENABLED is EMPTY, not unset-by-deletion —
      # `playwright.config.ts` reads it with `?? ''` and passes it to the
      # build, so an empty string IS the OFF shape.
      - name: auth-disabled + admin — accounts OFF
        env:
          CI: 'true'
          PUBLIC_AUTH_ENABLED: ''
        run: npx playwright test --project=chromium tests/e2e/auth-disabled.spec.ts tests/e2e/admin.spec.ts

      - name: Keep the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artefacts-sliver
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # ⚠️ ONE PLACE THAT SAYS "THE GATE IS GREEN", so a promotion has a single
  # thing to look at rather than six. It fails if ANY job failed — including a
  # job that was cancelled or skipped, because a gate that did not run is not a
  # gate that passed.
  # ──────────────────────────────────────────────────────────────────────────
  gate:
    name: gate
    if: always()
    needs: [preflight, matrix, sliver]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo "preflight: ${{ needs.preflight.result }}"
          echo "matrix:    ${{ needs.matrix.result }}"
          echo "sliver:    ${{ needs.sliver.result }}"
          if [ "${{ needs.preflight.result }}" != "success" ] \
            || [ "${{ needs.matrix.result }}" != "success" ] \
            || [ "${{ needs.sliver.result }}" != "success" ]; then
            echo "::error::The gate is NOT green. Read the failing job's artefacts before calling it environmental."
            exit 1
          fi
          echo "Gate green — five projects and the accounts-OFF sliver."
